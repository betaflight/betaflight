name: Queue new contributor PRs

# Runs in the base repo context with no checkout of PR code, so it is safe
# to use pull_request_target here. It never executes contributor code.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  queue:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["FIRST_TIMER","FIRST_TIME_CONTRIBUTOR","NONE"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    env:
      # convertPullRequestToDraft may reject GITHUB_TOKEN; set TRIAGE_TOKEN
      # (GitHub App / fine-grained PAT, pull-requests: write) if it does.
      GH_TOKEN: ${{ secrets.TRIAGE_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      NODE_ID: ${{ github.event.pull_request.node_id }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Convert to draft
        if: env.IS_DRAFT == 'false'
        # Direct GraphQL mutation: `gh pr ready --undo` / `gh pr edit` can hit
        # the deprecated Projects-classic query on betaflight repos.
        run: |
          gh api graphql \
            -f query='mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' \
            -f id="$NODE_ID"

      - name: Remove requested reviewers
        # CODEOWNERS requests are sent when a non-draft PR opens and are not
        # withdrawn by converting to draft.
        run: |
          sleep 10  # CODEOWNERS requests can land just after the opened event
          users=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers" --jq '[.users[].login]')
          teams=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers" --jq '[.teams[].slug]')
          if [ "$users" != "[]" ] || [ "$teams" != "[]" ]; then
            jq -n --argjson u "$users" --argjson t "$teams" '{reviewers: $u, team_reviewers: $t}' |
              gh api -X DELETE "repos/$REPO/pulls/$PR/requested_reviewers" --input -
          fi

      - name: Explain the queue
        run: |
          gh api "repos/$REPO/issues/$PR/comments" -f body="$(cat <<'EOF'
          Thanks for your contribution! This pull request has been converted to a **draft** and added to the review queue.

          When it is complete and CI is green, click **Ready for review**. Maintainers pick PRs from the queue by severity and scope; it stays open and visible in the meantime.

          Please see https://betaflight.com/docs/development before continuing.
          EOF
          )"
